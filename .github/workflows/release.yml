name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package, and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Build module archive
        shell: bash
        run: |
          mkdir -p release
          cp module.json README.md settings.example.json release/
          cp -R images lang scripts styles templates vendor release/
          (
            cd release
            zip -r ../module.zip .
          )

      - name: Verify module archive
        shell: bash
        run: |
          unzip -t module.zip
          unzip -Z1 module.zip | grep -Fxq "module.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          module.zip
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
